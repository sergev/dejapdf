<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="white"/>
<rect x="20" y="50" width="160" height="60" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="100" y="87.14" font-family="Helvetica, Arial, sans-serif" font-size="20.4" fill="#333333" text-anchor="middle" font-weight="bold">ZP decoder</text>
<text x="100" y="132" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">one stream for</text>
<text x="100" y="154.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">the whole chunk</text>
<rect x="204" y="50" width="160" height="60" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2" rx="3"/>
<text x="284" y="87.14" font-family="Helvetica, Arial, sans-serif" font-size="20.4" fill="#333333" text-anchor="middle" font-weight="bold">block header</text>
<text x="284" y="132" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">size: 24 raw bits</text>
<text x="284" y="154.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">speed: 1 or 2 raw bits</text>
<line x1="180" y1="80" x2="196.5" y2="80" stroke="#333333" stroke-width="1.2"/>
<polygon points="202,80 195.55,82.73 195.55,77.27" fill="#333333" stroke="none" stroke-width="1"/>
<rect x="388" y="50" width="160" height="60" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2" rx="3"/>
<text x="468" y="87.14" font-family="Helvetica, Arial, sans-serif" font-size="20.4" fill="#333333" text-anchor="middle" font-weight="bold">rank coder</text>
<text x="468" y="132" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">262 contexts,</text>
<text x="468" y="154.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">kept across blocks</text>
<line x1="364" y1="80" x2="380.5" y2="80" stroke="#333333" stroke-width="1.2"/>
<polygon points="386,80 379.55,82.73 379.55,77.27" fill="#333333" stroke="none" stroke-width="1"/>
<rect x="572" y="50" width="160" height="60" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2" rx="3"/>
<text x="652" y="87.14" font-family="Helvetica, Arial, sans-serif" font-size="20.4" fill="#333333" text-anchor="middle" font-weight="bold">move-to-front</text>
<text x="652" y="132" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">rank → byte;</text>
<text x="652" y="154.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">frequency-ordered</text>
<line x1="548" y1="80" x2="564.5" y2="80" stroke="#333333" stroke-width="1.2"/>
<polygon points="570,80 563.55,82.73 563.55,77.27" fill="#333333" stroke="none" stroke-width="1"/>
<rect x="756" y="50" width="160" height="60" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" rx="3"/>
<text x="836" y="87.14" font-family="Helvetica, Arial, sans-serif" font-size="20.4" fill="#333333" text-anchor="middle" font-weight="bold">inverse BWT</text>
<text x="836" y="132" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">one EOB marker</text>
<text x="836" y="154.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">per block</text>
<line x1="732" y1="80" x2="748.5" y2="80" stroke="#333333" stroke-width="1.2"/>
<polygon points="754,80 747.55,82.73 747.55,77.27" fill="#333333" stroke="none" stroke-width="1"/>
<text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18.7" fill="#333333" text-anchor="start">per block, until a block size of 0</text>
<text x="20" y="200" font-family="Helvetica, Arial, sans-serif" font-size="20.4" fill="#333333" text-anchor="start" font-weight="bold">Rank of the next byte in the MTF list</text>
<text x="30" y="228" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">0</text>
<text x="120" y="228" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">ctx[c]</text>
<text x="370" y="228" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start">c = previous rank if &lt; 2, else 2</text>
<text x="30" y="250" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">1</text>
<text x="120" y="250" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">ctx[c+3]</text>
<text x="370" y="250" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start"></text>
<text x="30" y="272" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">2–3</text>
<text x="120" y="272" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">ctx[6], then 1 bit</text>
<text x="370" y="272" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start">ranges grow by powers of 2;</text>
<text x="30" y="294" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">4–7</text>
<text x="120" y="294" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">ctx[8], then 2 bits</text>
<text x="370" y="294" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start">inner bits use a binary tree</text>
<text x="30" y="316" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">…</text>
<text x="120" y="316" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">…</text>
<text x="370" y="316" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start">of contexts</text>
<text x="30" y="338" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">128–255</text>
<text x="120" y="338" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">ctx[132], then 7 bits</text>
<text x="370" y="338" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start"></text>
<text x="30" y="360" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">256</text>
<text x="120" y="360" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16.15" fill="#333333" text-anchor="start">all tests fail</text>
<text x="370" y="360" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start">end-of-block marker (EOB)</text>
<rect x="640" y="290" width="290" height="100" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2" rx="3"/>
<text x="785" y="312" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">inverse BWT: count each byte,</text>
<text x="785" y="333.25" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">number its occurrences, walk</text>
<text x="785" y="354.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">back from the EOB position;</text>
<text x="785" y="375.75" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">a block yields size − 1 bytes</text>
</svg>
