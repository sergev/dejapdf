<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<rect width="860" height="420" fill="white"/>
<polygon points="90,340 310,340 250,386 30,386" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/>
<text x="170" y="368" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="middle" font-weight="bold">background</text>
<text x="340" y="354" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="end" font-weight="bold">1.</text>
<text x="350" y="354" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">BG44 → JPX image, low resolution</text>
<text x="350" y="375" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14.95" fill="#335" text-anchor="start">q W 0 0 H 0 0 cm /Bg Do Q</text>
<polygon points="90,225 310,225 250,271 30,271" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="170" y="253" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="middle" font-weight="bold">foreground</text>
<text x="340" y="239" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="end" font-weight="bold">2.</text>
<text x="350" y="239" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">one of:</text>
<text x="350" y="260" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">FG44 → JPX image whose /Mask is the stencil</text>
<text x="350" y="281" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">no FG44: the stencil painted in black (0 g)</text>
<text x="350" y="302" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">FGbz palette: one stencil per colour, r g b rg</text>
<polygon points="90,130 310,130 250,176 30,176" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="170" y="158" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="middle" font-weight="bold">hidden text</text>
<text x="340" y="144" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="end" font-weight="bold">3.</text>
<text x="350" y="144" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">TXTz words in render mode 3</text>
<text x="350" y="165" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14.95" fill="#335" text-anchor="start">BT 3 Tr /F1 … Tf … Tj ET</text>
<polygon points="90,40 310,40 250,86 30,86" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2"/>
<text x="170" y="68" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="middle" font-weight="bold">links</text>
<text x="340" y="54" font-family="Helvetica, Arial, sans-serif" font-size="16.9" fill="#333333" text-anchor="end" font-weight="bold">4.</text>
<text x="350" y="54" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">ANTz maparea → Link annotations</text>
<text x="350" y="75" font-family="Helvetica, Arial, sans-serif" font-size="16.25" fill="#333333" text-anchor="start">in the page's /Annots, not the content</text>
<line x1="20" y1="385" x2="20" y2="55.5" stroke="#808080" stroke-width="1.3"/>
<polygon points="20,50 22.73,56.45 17.27,56.45" fill="#808080" stroke="none" stroke-width="1"/>
<text x="14" y="20" font-family="Helvetica, Arial, sans-serif" font-size="14.3" fill="#808080" text-anchor="start">painting</text>
<text x="14" y="37.88" font-family="Helvetica, Arial, sans-serif" font-size="14.3" fill="#808080" text-anchor="start">order</text>
<text x="350" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14.95" fill="#808080" text-anchor="start">W × H: the page size in points</text>
</svg>
