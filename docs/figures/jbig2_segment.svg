<text x="46" y="160" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start" font-weight="bold">count and retain bits</text>
<text x="250" y="160" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="start">bits 5–7: 2 refs; bit 1: segment 0 is used again</text>
