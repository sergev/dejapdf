<text x="46" y="184" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start" font-weight="bold">referred-to segments</text>
<text x="250" y="184" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="start">1 byte each while number ≤ 256</text>
<rect x="20" y="195" width="16" height="16" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="46" y="208" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start" font-weight="bold">page association</text>
<text x="250" y="208" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="start">1 byte (4 if flag bit 6)</text>
<rect x="20" y="219" width="16" height="16" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
