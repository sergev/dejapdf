<text x="322" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="start" font-weight="bold">magnitude refinement</text>
<text x="322" y="264" font-family="Helvetica, Arial, sans-serif" font-size="16.15" fill="#333333" text-anchor="start">one more bit of each coefficient that is already significant</text>
<rect x="300" y="276" width="14" height="14" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="322" y="288" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="start" font-weight="bold">cleanup</text>
<text x="322" y="306" font-family="Helvetica, Arial, sans-serif" font-size="16.15" fill="#333333" text-anchor="start">the rest; a column of 4 all-zero-context coefficients is one run-length bit</text>
<text x="600" y="342" font-family="Helvetica, Arial, sans-serif" font-size="16.15" fill="#808080" text-anchor="middle">19 contexts: 0–8 significance (by sub-band type), 9–13 sign, 14–16 refinement,</text>
<text x="600" y="362" font-family="Helvetica, Arial, sans-serif" font-size="16.15" fill="#808080" text-anchor="middle">17 run-length, 18 UNIFORM; one MQ coder per code-block, reset at its start</text>
