<text x="445" y="152.62" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15.3" fill="#333333" text-anchor="start">      /Bg … /S0 … /S1 … &gt;&gt; &gt;&gt; &gt;&gt;</text>
<text x="445" y="180.16" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15.3" fill="#333333" text-anchor="start">q 1.0035 0 0 1.0027 0 -0.0027 cm /Bg Do Q</text>
