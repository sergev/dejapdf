<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600">
<rect width="940" height="600" fill="white"/>
<rect x="60" y="20" width="380" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="250" y="45.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">s = state[ctx];  Z = A + Δ(s)</text>
<line x1="250" y1="60" x2="250" y2="78.5" stroke="#333333" stroke-width="1.2"/>
<polygon points="250,84 247.27,77.55 252.73,77.55" fill="#333333" stroke="none" stroke-width="1"/>
<polygon points="250,85 400,130 250,175 100,130" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="250" y="127" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">Z &lt; 0x8000</text>
<text x="250" y="148.25" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">and Z ≤ C ?</text>
<line x1="400" y1="130" x2="522.5" y2="130" stroke="#333333" stroke-width="1.2"/>
<polygon points="528,130 521.55,132.73 521.55,127.27" fill="#333333" stroke="none" stroke-width="1"/>
<text x="425" y="122" font-family="Helvetica, Arial, sans-serif" font-size="18.7" fill="#808080" text-anchor="middle">yes</text>
<rect x="530" y="106" width="400" height="48" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2" rx="3"/>
<text x="730" y="125.75" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">MPS fast path: bit = ctx &amp; 1</text>
<text x="730" y="146.15" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">A = Z, no state change</text>
<line x1="250" y1="175" x2="250" y2="194.5" stroke="#333333" stroke-width="1.2"/>
<polygon points="250,200 247.27,193.55 252.73,193.55" fill="#333333" stroke="none" stroke-width="1"/>
<text x="258" y="194" font-family="Helvetica, Arial, sans-serif" font-size="18.7" fill="#808080" text-anchor="start">no</text>
<rect x="30" y="200" width="440" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="250" y="225.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">Z = min(Z, 0x6000 + (Z + A)/4)</text>
<line x1="250" y1="240" x2="250" y2="258.5" stroke="#333333" stroke-width="1.2"/>
<polygon points="250,264 247.27,257.55 252.73,257.55" fill="#333333" stroke="none" stroke-width="1"/>
<polygon points="250,264 360,300 250,336 140,300" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="250" y="305" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">C ≥ Z ?</text>
<line x1="360" y1="300" x2="522.5" y2="300" stroke="#333333" stroke-width="1.2"/>
<polygon points="528,300 521.55,302.73 521.55,297.27" fill="#333333" stroke="none" stroke-width="1"/>
<text x="385" y="292" font-family="Helvetica, Arial, sans-serif" font-size="18.7" fill="#808080" text-anchor="middle">yes</text>
<rect x="530" y="264" width="400" height="72" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2" rx="3"/>
<text x="730" y="285.55" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">MPS: bit = ctx &amp; 1</text>
<text x="730" y="305.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">if A ≥ θ(s): ctx = μ(s)</text>
<text x="730" y="326.35" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">A = Z</text>
<line x1="250" y1="336" x2="250" y2="364.5" stroke="#333333" stroke-width="1.2"/>
<polygon points="250,370 247.27,363.55 252.73,363.55" fill="#333333" stroke="none" stroke-width="1"/>
<text x="258" y="360" font-family="Helvetica, Arial, sans-serif" font-size="18.7" fill="#808080" text-anchor="start">no</text>
<rect x="30" y="370" width="440" height="72" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.2" rx="3"/>
<text x="250" y="391.55" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">LPS: bit = 1 − (ctx &amp; 1)</text>
<text x="250" y="411.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">ctx = λ(s)</text>
<text x="250" y="432.35" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">A += 0x10000 − Z;  C += same</text>
<rect x="530" y="440" width="400" height="72" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" rx="3"/>
<text x="730" y="461.55" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">renormalise: while A ≥ 0x8000:</text>
<text x="730" y="481.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">A = 2A − 0x10000</text>
<text x="730" y="502.35" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">C = 2C − 0x10000 + next bit</text>
<line x1="730" y1="336" x2="730" y2="432.5" stroke="#333333" stroke-width="1.2"/>
<polygon points="730,438 727.27,431.55 732.73,431.55" fill="#333333" stroke="none" stroke-width="1"/>
<line x1="470" y1="406" x2="524.31" y2="465.92" stroke="#333333" stroke-width="1.2"/>
<polygon points="528,470 521.65,467.05 525.69,463.39" fill="#333333" stroke="none" stroke-width="1"/>
<text x="470" y="548" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">A: interval register, C: code register, starting as the first two bytes;</text>
<text x="470" y="569.25" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">past the end, input bits are 1. Pass-through: Z = 0x8000 + A/2 (BZZ)</text>
<text x="470" y="590.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">or 0x8000 + 3A/8 (IW44), no context, no adaptation.</text>
<text x="730" y="92" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="middle">the common case</text>
</svg>
