<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420">
<rect width="940" height="420" fill="white"/>
<text x="20" y="26" font-family="Helvetica, Arial, sans-serif" font-size="23.8" fill="#333333" text-anchor="start" font-weight="bold">Bytes of a one-page file</text>
<rect x="20" y="44" width="136" height="40" fill="#f5f5f5" stroke="#999999" stroke-width="1.2" rx="3"/>
<text x="88" y="69.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">AT&amp;T</text>
<text x="88" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="middle">magic</text>
<rect x="156" y="44" width="136" height="40" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" rx="3"/>
<text x="224" y="69.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">FORM</text>
<text x="224" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="middle">id</text>
<rect x="292" y="44" width="136" height="40" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" rx="3"/>
<text x="360" y="69.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">00 00 68 A6</text>
<text x="360" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="middle">size, big-endian</text>
<rect x="428" y="44" width="136" height="40" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" rx="3"/>
<text x="496" y="69.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">DJVU</text>
<text x="496" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="middle">form type</text>
<rect x="564" y="44" width="136" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="632" y="69.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">INFO</text>
<text x="632" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="middle">id</text>
<rect x="700" y="44" width="136" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="768" y="69.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">00 00 00 0A</text>
<text x="768" y="102" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="middle">size = 10</text>
<text x="844" y="70" font-family="Helvetica, Arial, sans-serif" font-size="23.8" fill="#333333" text-anchor="start">…</text>
<path d="M428,112 L428,124 L920,124 L920,112" fill="none" stroke="#808080" stroke-width="1"/>
<text x="674" y="146" font-family="Helvetica, Arial, sans-serif" font-size="18.7" fill="#808080" text-anchor="middle">0x68A6 = 26790 bytes: the form type and all chunks inside</text>
<text x="20" y="192" font-family="Helvetica, Arial, sans-serif" font-size="23.8" fill="#333333" text-anchor="start" font-weight="bold">The same file as a tree (djvudump)</text>
<rect x="20" y="206" width="320" height="30" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" rx="3"/>
<text x="180" y="226.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">FORM:DJVU [26790]</text>
<text x="354" y="227" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">the page; INFO comes first</text>
<rect x="54" y="244" width="286" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="197" y="264.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">INFO [10]</text>
<text x="354" y="265" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">size, version, dpi, gamma, rotation</text>
<rect x="54" y="282" width="286" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="197" y="302.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">Sjbz [13133]</text>
<text x="354" y="303" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">mask, JB2</text>
<rect x="54" y="320" width="286" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="197" y="340.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">FG44 [185]</text>
<text x="354" y="341" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">foreground colour, IW44</text>
<rect x="54" y="358" width="286" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" rx="3"/>
<text x="197" y="378.95" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#333333" text-anchor="middle">BG44 [935]  BG44 [1672] …</text>
<text x="354" y="379" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">background, IW44, refined in order</text>
<rect x="690" y="206" width="230" height="136" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2" rx="3"/>
<text x="805" y="232" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="middle">each chunk: 4-byte id,</text>
<text x="805" y="254.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="middle">4-byte size, data,</text>
<text x="805" y="276.62" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="middle">a 0x00 pad byte if the</text>
<text x="805" y="298.94" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="middle">size is odd (not counted)</text>
<text x="805" y="370" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">FORM data: 4-byte</text>
<text x="805" y="392.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#808080" text-anchor="middle">type, then chunks</text>
</svg>
