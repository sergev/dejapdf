<text x="795" y="64" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">per strip: delta T (IADT)</text>
<text x="795" y="85.25" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">first S: delta from the</text>
<text x="795" y="106.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">previous strip's first S (IAFS)</text>
<text x="795" y="127.75" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">then per instance: ID (IAID)</text>
<rect x="670" y="176" width="250" height="194" fill="#fafafa" stroke="#cccccc" stroke-width="1.2" rx="3"/>
<text x="795" y="200" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">next S (IADS) = gap from</text>
<text x="795" y="221.25" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">the previous right edge:</text>
<text x="795" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">S − (S′ + W′ − 1) − DSOFFSET</text>
<text x="795" y="263.75" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle"></text>
<text x="795" y="285" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">OOB (IADS) ends the strip</text>
<text x="795" y="306.25" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle"></text>
<text x="795" y="327.5" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">red dot: reference corner,</text>
<text x="795" y="348.75" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">BOTTOMLEFT</text>
<text x="470" y="404" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">Strips of height 1, 2, 4 or 8 group instances by T; inside a strip each instance codes</text>
<text x="470" y="425.25" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">its T offset (IAIT) unless the strip height is 1. All S and T values are in pixels.</text>
</svg>
