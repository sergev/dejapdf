<text x="510" y="60" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start" font-weight="bold">kept (green) up to the red cut:</text>
<text x="510" y="82" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">each pass lowers the distortion by ΔD</text>
<text x="510" y="104.31" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">and costs ΔR bytes; keep the passes</text>
<text x="510" y="126.62" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">whose ΔD/ΔR ≥ λ, and search for the λ</text>
<text x="510" y="148.94" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">whose total R fits the byte budget</text>
<text x="510" y="171.25" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">(J.13). One layer: one cut per block.</text>
<text x="510" y="193.56" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start"></text>
<text x="510" y="215.88" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">Several layers = several cuts, for</text>
<text x="510" y="238.19" font-family="Helvetica, Arial, sans-serif" font-size="17.85" fill="#333333" text-anchor="start">progressive display; dejapdf uses one.</text>
<text x="20" y="344" font-family="Helvetica, Arial, sans-serif" font-size="20.4" fill="#333333" text-anchor="start" font-weight="bold">One packet = (layer, resolution, component, precinct)</text>
<rect x="20" y="360" width="340" height="56" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2" rx="3"/>
<text x="190" y="383.75" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">header: included? new: zero bit-planes;</text>
<text x="190" y="404.15" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">passes (B.4 codes); byte lengths</text>
<rect x="360" y="360" width="280" height="56" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2" rx="3"/>
<text x="500" y="383.75" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">body: the bytes of each block's</text>
<text x="500" y="404.15" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#333333" text-anchor="middle">new passes, in order</text>
<text x="656" y="380" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start">packet headers are bit-packed</text>
<text x="656" y="401.25" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#808080" text-anchor="start">with tag trees; after 0xFF a 0 bit</text>
