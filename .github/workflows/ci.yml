name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Test oracles: run, never linked.
      - name: Install oracle tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            djvulibre-bin jbig2dec qpdf mupdf-tools poppler-utils \
            libopenjp2-tools ghostscript
      - run: make lint
      - run: make build
      - run: go test ./...
